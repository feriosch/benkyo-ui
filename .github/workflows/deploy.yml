name: Build and Deploy to GCP

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g., 6.0, 7.0)"
        required: true
        type: string

env:
  REGION: us-central1
  REPOSITORY: benkyo-frontend-repo
  IMAGE_NAME: benkyo-web-ui

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Inject environment variables
        run: |
          sed -i 's|__PROD_BACKEND_IP__|${{ vars.PROD_BACKEND_IP }}|g' src/environments/environment.prod.ts

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build . \
            -f Dockerfile \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}

      - name: Output image URL
        run: |
          echo "✅ Image pushed successfully!"
          echo "📦 ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}"
