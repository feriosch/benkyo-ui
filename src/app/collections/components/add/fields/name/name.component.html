<ng-container [formGroup]="form">
  <div class="field is-horizontal">
    <div class="field-label">
      <label class="label">Printing Name</label>
    </div>
    <div class="field-body is-flex-grow-6">
      <div class="field">
        <div class="control">
          <input
            [ngClass]="{ 'is-danger': isPrintingNameInvalid }"
            formControlName="printingName"
            class="input"
            type="text"
            placeholder="Enter collection printing name"
          />
        </div>
        @if (isPrintingNameInvalid) {
          <p class="help is-danger">Printing name is required!</p>
        }
      </div>
    </div>
  </div>
  <div class="field is-horizontal">
    <div class="field-label">
      <label class="label">Identification Name</label>
    </div>
    <div class="field-body is-flex-grow-6">
      <div class="field">
        <div class="control">
          <input
            [ngClass]="{ 'is-danger': isCollectionNameInvalid }"
            formControlName="collectionName"
            class="input"
            type="text"
            placeholder="Enter identification name (collection_name)"
          />
        </div>
        @if (isCollectionNameInvalid) {
          <p class="help is-danger">Identification name is required!</p>
        }
      </div>
    </div>
  </div>
  <div class="field is-horizontal">
    <div class="field-label">
      <label class="label">Group</label>
    </div>
    <div class="field-body is-flex-grow-6">
      <div class="field">
        <div class="control">
          <input
            [ngClass]="{ 'is-danger': isGroupInvalid }"
            formControlName="group"
            class="input"
            type="text"
            placeholder="Enter collection group"
          />
        </div>
        @if (isGroupInvalid) {
          <p class="help is-danger">Group is required!</p>
        }
      </div>
    </div>
  </div>
</ng-container>
