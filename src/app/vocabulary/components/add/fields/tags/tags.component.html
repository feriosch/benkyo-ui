<ng-container [formGroup]="formGroup!">
  <div class="tags-grid">
    @for (tag of tags; track tag) {
      <span
        class="word-tag"
        [ngClass]="{ 'is-active': getTagValue(tag) }"
        (click)="onClickTag(tag)"
      >
        {{ getPrintingValue(tag) }}
      </span>
    }
  </div>
</ng-container>
