<ng-container [formGroup]="formGroup!">
  <div class="type-grid">
    @for (subtype of subtypes; track subtype) {
      <div
        class="type-cell"
        (click)="onClickSubtype(subtype)"
        [ngClass]="{
          'is-common': getSubtypeValue(subtype) === 1,
          'is-rare': getSubtypeValue(subtype) === 2,
          'is-extra': getSubtypeValue(subtype) > 2
        }"
        [title]="subtype"
      >
        <span class="type-value">{{
          getMappedText(getSubtypeValue(subtype), subtype)
        }}</span>
      </div>
    }
  </div>
</ng-container>
