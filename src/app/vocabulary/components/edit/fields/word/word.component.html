<ng-container [formGroup]="formGroup!">
  <div class="word-display mb-5">
    <span class="word-text">{{ word! }}</span>
  </div>
  <div class="field is-horizontal mb-5">
    <div class="field-label">
      <label class="label">Hiragana</label>
    </div>
    <div class="field-body">
      <div class="field">
        <div class="control">
          <input
            formControlName="hiragana"
            class="input"
            type="text"
            placeholder="Enter hiragana (optional)"
          />
        </div>
      </div>
    </div>
  </div>
  <div class="field is-horizontal">
    <div class="field-label">
      <label class="label">Spanish</label>
    </div>
    <div class="field-body">
      <div class="field is-grouped">
        <div class="control is-expanded">
          <input
            [ngClass]="{
              'is-danger': spanishControl!.touched && spanishControl!.invalid
            }"
            formControlName="spanish"
            class="input"
            type="text"
            placeholder="Enter Spanish translation"
          />
        </div>
        @if (spanishControl!.touched && spanishControl!.invalid) {
          <p class="help is-danger">Spanish translation is required!</p>
        }
        <div class="control">
          <button
            class="button is-info is-light"
            type="button"
            [disabled]="isSpanishNDisabled"
            (click)="addSpanishN()"
          >
            ñ
          </button>
        </div>
      </div>
    </div>
  </div>
</ng-container>
