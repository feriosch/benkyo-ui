<div class="columns is-vcentered">
  <div class="column is-9">
    <div class="block has-text-centered-mobile">
      @for (character of word.split(""); track character) {
        <span
          (click)="onClickCharacter(character)"
          class="title is-1 is-inline-block character"
        >
          {{ character }}
        </span>
      }
      @if (hiragana) {
        <span class="subtitle is-3 ml-4"> ( {{ hiragana }} ) </span>
      }
    </div>
    <div class="block has-text-centered-mobile">
      <p class="subtitle is-2">
        {{ spanish }}
      </p>
    </div>
  </div>
  <div class="column is-3">
    @if (collection) {
      <div class="has-text-centered">
        <p class="title is-4">
          {{ collection.printing_name }}
        </p>
        <figure class="image is-96x96 is-inline-block" id="collection-figure">
          <img [src]="collection.image_url" [alt]="collection.printing_name" />
        </figure>
      </div>
    }
  </div>
</div>
<app-kanji-modal #kanjiModal [character]="selectedKanji"></app-kanji-modal>
