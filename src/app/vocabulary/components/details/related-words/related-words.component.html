<div class="related-words-section">
  <p class="title is-5 has-text-centered mb-4">
    <span class="icon-text">
      <span class="icon">
        <i class="fas fa-link"></i>
      </span>
      <span>Related Words</span>
    </span>
  </p>

  <div class="related-words-grid">
    @for (rel of related; track rel) {
      <div class="related-word-card" (click)="onClickWord(rel.wordId)">
        <div class="card-content">
          <span class="tag is-small" [ngClass]="getTypeClass(rel.type)">
            {{ getTypeLabel(rel.type) }}
          </span>
          <p class="word-text">{{ rel.word }}</p>
          @if (rel.hiragana) {
            <p class="hiragana-text">
              {{ rel.hiragana }}
            </p>
          }
          @if (rel.spanish) {
            <p class="spanish-text">
              {{ rel.spanish }}
            </p>
          }
          @if (rel.note) {
            <p class="note-text">
              {{ rel.note }}
            </p>
          }
        </div>
      </div>
    }
  </div>
</div>
